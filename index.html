<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7c3aed"><title>JLPT Myanmar</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f5f3ff;color:#261545}header{background:linear-gradient(135deg,#6d28d9,#a78bfa);color:white;padding:25px 18px;border-radius:0 0 25px 25px}main{max-width:650px;margin:auto;padding:16px}h1{margin:0;font-size:27px}h2{font-size:20px}.card{background:white;padding:17px;margin:12px 0;border-radius:18px;box-shadow:0 3px 15px #5b21b614}button{border:0;border-radius:12px;background:#7c3aed;color:white;padding:12px 15px;font-size:15px;margin:4px;cursor:pointer}button.secondary{background:#ede9fe;color:#5b21b6}button.active{background:#4c1d95}button:disabled{opacity:.55}.row{display:flex;flex-wrap:wrap;gap:3px}.muted{color:#71658b;font-size:14px}.jp{font-size:25px;font-weight:700}.answer{display:block;width:100%;text-align:left;margin:8px 0}.good{color:#15803d}.bad{color:#b91c1c}nav{display:flex;flex-wrap:wrap;gap:5px}nav button{flex:1;min-width:90px}#content{min-height:240px}</style></head><body><header><h1>JLPT Myanmar 💜</h1><p>ဂျပန်စာကို မြန်မာလို လေ့လာကြမယ်</p></header><main><div class="card"><strong>JLPT Level ရွေးပါ</strong><div class="row" id="levels"></div></div><div class="card"><nav id="nav"></nav></div><section id="content"></section></main><script>
const samples={N5:{v:[['水','みず','ရေ'],['学校','がっこう','ကျောင်း'],['食べる','たべる','စားသည်']],g:[['〜です','ယဉ်ကျေးသော အတည်ပြုဝါကျအဆုံးသတ်','学生です。','ကျောင်းသားဖြစ်ပါတယ်။']],k:[['日','にち / ひ','နေ့၊ နေ'],['山','さん / やま','တောင်']]},N4:{v:[['約束','やくそく','ကတိ'],['準備','じゅんび','ပြင်ဆင်ခြင်း']],g:[['〜ながら','တစ်ခုလုပ်ရင်း တစ်ခုလုပ်ခြင်း','音楽を聞きながら勉強します。','သီချင်းနားထောင်ရင်း စာလေ့လာပါတယ်။']],k:[['旅','りょ / たび','ခရီး']]},N3:{v:[['環境','かんきょう','ပတ်ဝန်းကျင်']],g:[['〜ようにする','လုပ်ဖြစ်အောင် ကြိုးစားခြင်း','毎日読むようにしています。','နေ့တိုင်း ဖတ်ဖြစ်အောင် ကြိုးစားနေပါတယ်။']],k:[['境','きょう / さかい','နယ်နိမိတ်']]},N2:{v:[['影響','えいきょう','သက်ရောက်မှု']],g:[['〜にもかかわらず','ဖြစ်သော်လည်း','雨にもかかわらず出かけた。','မိုးရွာသော်လည်း အပြင်ထွက်ခဲ့သည်။']],k:[['響','きょう / ひびく','ပဲ့တင်သံ၊ သက်ရောက်ခြင်း']]},N1:{v:[['概念','がいねん','အယူအဆ']],g:[['〜を余儀なくされる','မလွှဲမရှောင်သာ လုပ်ရခြင်း','計画の変更を余儀なくされた。','အစီအစဉ်ကို မဖြစ်မနေ ပြောင်းလဲခဲ့ရသည်။']],k:[['概','がい','အကြမ်းဖျဉ်း']]}};
let level='N5',tab='Vocabulary',answered=false;let progress={};try{progress=JSON.parse(localStorage.getItem('jlpt-progress')||'{}')}catch(e){}const save=()=>localStorage.setItem('jlpt-progress',JSON.stringify(progress));const el=id=>document.getElementById(id);const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function init(){el('levels').innerHTML=['N5','N4','N3','N2','N1'].map(x=>`<button class="${x===level?'active':'secondary'}" data-level="${x}">${x}</button>`).join('');el('nav').innerHTML=['Vocabulary','Grammar','Kanji','Quiz','Progress'].map(x=>`<button class="${x===tab?'active':'secondary'}" data-tab="${x}">${x}</button>`).join('');document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{level=b.dataset.level;init()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;init()});render()}function render(){const d=samples[level];if(tab==='Vocabulary')el('content').innerHTML='<h2>'+level+' Vocabulary</h2>'+d.v.map(([w,r,m])=>`<div class="card"><div class="jp">${escapeHtml(w)}</div><p>${escapeHtml(r)}</p><strong>${escapeHtml(m)}</strong></div>`).join('');if(tab==='Grammar')el('content').innerHTML='<h2>'+level+' Grammar</h2>'+d.g.map(([p,m,j,b])=>`<div class="card"><div class="jp">${escapeHtml(p)}</div><p>${escapeHtml(m)}</p><p>${escapeHtml(j)}</p><p class="muted">${escapeHtml(b)}</p></div>`).join('');if(tab==='Kanji')el('content').innerHTML='<h2>'+level+' Kanji</h2>'+d.k.map(([k,r,m])=>`<div class="card"><div class="jp">${escapeHtml(k)}</div><p>${escapeHtml(r)}</p><strong>${escapeHtml(m)}</strong></div>`).join('');if(tab==='Quiz')quiz();if(tab==='Progress'){let p=progress[level]||{attempts:0,correct:0};el('content').innerHTML=`<h2>${level} Progress</h2><div class="card"><p>Quiz ဖြေဆိုမှု: <strong>${p.attempts}</strong> ကြိမ်</p><p>အဖြေမှန်: <strong>${p.correct}</strong> ခု</p><p>မှန်ကန်မှု: <strong>${p.attempts?Math.round(p.correct/p.attempts*100):0}%</strong></p><p class="muted">ဒီဖုန်း Browser ထဲမှာပဲ သိမ်းထားပါတယ်။</p></div>`}}function quiz(){answered=false;const item=samples[level].v[0];const wrong=Object.values(samples).flatMap(x=>x.v.map(v=>v[2])).filter(x=>x!==item[2]);let options=[item[2],...wrong.slice(0,3)];options=options.sort(()=>Math.random()-.5);el('content').innerHTML=`<h2>${level} Quiz</h2><div class="card"><p class="jp">${escapeHtml(item[0])}</p><p>ဒီစကားလုံးရဲ့ အဓိပ္ပါယ်က ဘာလဲ။</p><div id="answers">${options.map((x,i)=>`<button class="answer secondary" data-answer="${i}">${escapeHtml(x)}</button>`).join('')}</div><p id="feedback"></p><button id="again" style="display:none">ထပ်ဖြေမယ်</button></div>`;document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;const ok=options[Number(b.dataset.answer)]===item[2];let p=progress[level]||{attempts:0,correct:0};p.attempts++;if(ok)p.correct++;progress[level]=p;save();el('feedback').innerHTML=ok?'<strong class="good">မှန်ပါတယ်! ✓</strong>':`<strong class="bad">မမှန်ပါ။</strong> အဖြေမှန်: ${escapeHtml(item[2])}`;document.querySelectorAll('[data-answer]').forEach(x=>x.disabled=true);el('again').style.display='inline-block';el('again').onclick=quiz})}init();</script></body></html>
