<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7c3aed"><title>JLPT Myanmar V0.5</title><style>
:root{--bg:#f5f2ff;--card:#fff;--ink:#24183d;--muted:#675e77;--purple:#7436d7;--line:#e5dcf3}body.dark{--bg:#141020;--card:#241b34;--ink:#f6efff;--muted:#c8b9dd;--purple:#ae82ff;--line:#453657}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Noto Sans Myanmar',system-ui,sans-serif;line-height:1.6}header{background:linear-gradient(115deg,#5722bc,#9a6df0);color:white;padding:28px 18px;border-radius:0 0 28px 28px}header h1{margin:0;font-size:27px}header p{margin:4px 0 0}.wrap{max-width:680px;margin:auto;padding:16px}section,.panel{background:var(--card);border-radius:18px;padding:16px;margin:0 0 14px;border:1px solid var(--line)}h2{font-size:19px;margin:0 0 10px}h3{margin:0 0 8px}button,select,input{font:inherit}button,select{border-radius:11px;border:1px solid var(--line);padding:10px 12px;background:var(--card);color:var(--ink)}button{cursor:pointer}button.active,.primary{background:var(--purple);color:white;border-color:var(--purple)}.tabs,.levels,.row{display:flex;gap:7px;flex-wrap:wrap}.tabs button{flex:1 1 28%;font-size:13px}.levels button{flex:1}.item{padding:13px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.muted,small{color:var(--muted)}.jp{font-size:23px;font-weight:700}.pill{font-size:12px;border-radius:15px;background:var(--bg);padding:3px 9px;display:inline-block}.answers{display:grid;gap:8px;margin:12px 0}.answers button{text-align:left}.answers button:disabled{opacity:.75}.correct{border:2px solid #16a34a!important}.wrong{border:2px solid #e14c5c!important}.bar{height:12px;border-radius:9px;background:var(--line);overflow:hidden}.bar>div{height:100%;background:var(--purple);transition:width .2s}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}#content{min-height:180px}footer{text-align:center;color:var(--muted);padding:12px;font-size:12px}
</style></head><body><header><div class="top"><div><h1>JLPT Myanmar 💜</h1><p>ဂျပန်စာကို မြန်မာလို လေ့လာကြမယ်</p></div><button id="theme" aria-label="Toggle dark mode">🌙 Dark</button></div></header><main class="wrap"><section><h2>JLPT Level ရွေးပါ</h2><div class="levels" id="levels"></div><p class="muted" style="margin-bottom:0;font-size:13px">N5–N1 ကို ရွေးနိုင်ပါတယ်။ သင်ခန်းစာများမှာ လောလောဆယ် နမူနာအချက်အလက်သာ ပါဝင်ပါသေးသည်။</p></section><nav class="tabs" id="tabs" aria-label="Learning sections"></nav><section id="content" aria-live="polite"></section><footer>V0.4 • Offline data on this device • Demo content • No account needed</footer></main><script>
'use strict';
const LESSONS={
N5:{v:[['水','みず','ရေ'],['学校','がっこう','ကျောင်း'],['食べる','たべる','စားသည်'],['今日','きょう','ဒီနေ့']],g:[['〜です','ယဉ်ကျေးသော အတည်ပြုဝါကျအဆုံးသတ်','私は学生です。','ကျွန်တော်/ကျွန်မ ကျောင်းသားဖြစ်ပါတယ်။'],['〜ません','ယဉ်ကျေးသော အငြင်းပုံစံ','肉を食べません。','အသား မစားပါ။']],k:[['日','にち・ひ','နေ့ / နေ'],['人','じん・ひと','လူ'],['山','さん・やま','တောင်']]},
N4:{v:[['約束','やくそく','ကတိ / ချိန်းဆိုမှု'],['準備','じゅんび','ပြင်ဆင်ခြင်း'],['運転','うんてん','ယာဉ်မောင်းခြင်း']],g:[['〜ながら','လုပ်ဆောင်မှုနှစ်ခုကို တစ်ပြိုင်နက် ပြုလုပ်ခြင်း','音楽を聞きながら勉強します。','သီချင်းနားထောင်ရင်း စာလေ့လာတယ်။']],k:[['旅','りょ・たび','ခရီး'],['運','うん・はこぶ','သယ်ဆောင်ခြင်း / ကံ']]},
N3:{v:[['環境','かんきょう','ပတ်ဝန်းကျင်'],['結果','けっか','ရလဒ်'],['経験','けいけん','အတွေ့အကြုံ']],g:[['〜ようにする','တစ်ခုခုကို ကြိုးစားလုပ်ဆောင်သည့် အလေ့အကျင့်','毎日読むようにしています。','နေ့တိုင်း ဖတ်ဖို့ ကြိုးစားနေပါတယ်။']],k:[['境','きょう・さかい','နယ်နိမိတ်'],['験','けん','စမ်းသပ်ခြင်း / အတွေ့အကြုံ']]},
N2:{v:[['改善','かいぜん','တိုးတက်ကောင်းမွန်အောင် ပြုပြင်ခြင်း'],['責任','せきにん','တာဝန်'],['傾向','けいこう','လမ်းကြောင်း / သဘောထား']],g:[['〜にもかかわらず','...ဖြစ်သော်လည်း','雨にもかかわらず出かけた。','မိုးရွာသော်လည်း အပြင်ထွက်ခဲ့တယ်။']],k:[['責','せき','တာဝန် / အပြစ်'],['傾','けい・かたむく','ယိမ်းယိုင်ခြင်း']]},
N1:{v:[['顕著','けんちょ','သိသာထင်ရှားသော'],['遂行','すいこう','ပြီးမြောက်အောင် ဆောင်ရွက်ခြင်း'],['概念','がいねん','အယူအဆ']],g:[['〜を余儀なくされる','မဖြစ်မနေ လုပ်ဆောင်ရသည့် အခြေအနေ','計画の変更を余儀なくされた。','အစီအစဉ်ကို မဖြစ်မနေ ပြောင်းလဲခဲ့ရတယ်။']],k:[['顕','けん','ထင်ရှားခြင်း'],['遂','すい・とげる','ပြီးမြောက်စေခြင်း']]}
};
const SECTIONS=[['v','📚 Vocabulary'],['g','📝 Grammar'],['k','🈶 Kanji'],['quiz','✅ Mock Test'],['progress','📊 Progress'],['n1','🎓 N1 Exam Library']];
const STORE='jlpt-myanmar-v04';let saved={};try{saved=JSON.parse(localStorage.getItem(STORE)||'{}')||{}}catch(e){};saved.scores=saved.scores||{};saved.studied=saved.studied||{};let level=saved.level||'N5',tab='v',test=null;
const $=id=>document.getElementById(id);const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){try{localStorage.setItem(STORE,JSON.stringify(saved))}catch(e){}}function renderNav(){ $('levels').innerHTML=['N5','N4','N3','N2','N1'].map(l=>`<button data-level="${l}" class="${l===level?'active':''}">${l}</button>`).join('');$('tabs').innerHTML=SECTIONS.map(([id,label])=>`<button data-tab="${id}" class="${tab===id?'active':''}">${label}</button>`).join('')}
const N1BANK=[
{type:'Vocabulary',q:'「著しい」の読み方として正しいものは？',opts:['いちじるしい','はなはだしい','あやしい','めざましい'],a:0,ex:'著しい（いちじるしい） = သိသိသာသာ၊ အလွန်ထင်ရှားသော။ 例：著しい成長（သိသာထင်ရှားသော တိုးတက်မှု）။'},
{type:'Vocabulary',q:'「計画を遂行する」の「遂行」に最も近い意味は？',opts:['延期する','実行する','中止する','変更する'],a:1,ex:'遂行（すいこう） = အစီအစဉ်ကို အကောင်အထည်ဖော်ဆောင်ရွက်ခြင်း။ 実行する နဲ့ အနီးစပ်ဆုံးပါ။'},
{type:'Vocabulary',q:'「懸念」の意味として最も適切なのは？',opts:['期待','心配','満足','感謝'],a:1,ex:'懸念（けねん） = စိုးရိမ်ပူပန်မှု။ 心配 နဲ့ အဓိပ္ပါယ်နီးစပ်ပါတယ်။'},
{type:'Grammar',q:'彼は努力を重ねた（　）、目標を達成した。',opts:['あげく','末に','ものの','かたわら'],a:1,ex:'～末に = အချိန်ကြာကြာ ကြိုးစား/စဉ်းစားပြီးနောက် ရလာတဲ့ ရလဒ်။ あげく က အများအားဖြင့် မကောင်းတဲ့ရလဒ်နဲ့ တွဲသုံးပါတယ်။'},
{type:'Grammar',q:'台風のため、イベントの中止を（　）。',opts:['余儀なくされた','禁じ得なかった','ものとした','皮切りにした'],a:0,ex:'～を余儀なくされる = ပြင်ပအခြေအနေကြောင့် မဖြစ်မနေ လုပ်ရခြင်း။ တိုင်ဖွန်းကြောင့် ပွဲဖျက်ရတာကို ဆိုလိုပါတယ်။'},
{type:'Grammar',q:'この問題は専門家（　）解決が難しい。',opts:['に即して','といえども','をもって','にひきかえ'],a:1,ex:'～といえども = ...ဖြစ်သော်လည်း / ...တောင်မှ။ ကျွမ်းကျင်သူဖြစ်ရင်တောင် ဖြေရှင်းဖို့ ခက်ခဲတယ်။'},
{type:'Reading',pass:'市では、使い捨て容器を減らすため、公共施設に給水機を設置した。しかし、利用者が少ないことが分かった。担当者は、設置場所を知らせるだけでなく、利用する利点も伝える必要があると考えている。',q:'担当者は今後、何が必要だと考えているか。',opts:['給水機を撤去すること','設置場所と利用の利点を知らせること','容器の販売を増やすこと','公共施設を閉鎖すること'],a:1,ex:'မြို့က တစ်ခါသုံးဘူးတွေ လျှော့ဖို့ ရေဖြည့်စက်တပ်ထားပေမဲ့ သုံးသူနည်းနေပါတယ်။ တာဝန်ရှိသူက တည်နေရာသာမက အသုံးပြုရခြင်းရဲ့ အကျိုးကျေးဇူးကိုပါ အသိပေးဖို့လိုတယ်လို့ ယူဆပါတယ်။'},
{type:'Reading',pass:'新しい制度は手続きを簡単にする目的で導入された。ところが、利用方法が十分に説明されなかったため、かえって問い合わせが増えた。制度そのものよりも、周知の方法に改善の余地がある。',q:'筆者が問題だと考えているのは何か。',opts:['制度の目的','利用者の人数','説明・周知の方法','問い合わせの受付時間'],a:2,ex:'စနစ်အသစ်ရဲ့ ရည်ရွယ်ချက်က လုပ်ငန်းစဉ်လွယ်ကူစေဖို့ ဖြစ်ပေမဲ့ ရှင်းပြမှုမလုံလောက်လို့ မေးမြန်းမှု ပိုများလာပါတယ်။ ပြဿနာက အသိပေးရှင်းပြပုံ ဖြစ်ပါတယ်။'},
{type:'Reading',pass:'ある企業では、在宅勤務を続ける一方で、週に一度は社員が集まる日を設けた。個人の作業効率を保ちながら、偶然の会話から生まれるアイデアも大切にしたいという考えからだ。',q:'企業が週に一度集まる日を設けた理由は？',opts:['在宅勤務を廃止するため','社員の通勤時間を増やすため','作業効率と交流の両方を重視するため','会議の回数を毎日増やすため'],a:2,ex:'အိမ်ကနေ အလုပ်လုပ်ခြင်းရဲ့ ထိရောက်မှုကို ထိန်းထားရင်း ဝန်ထမ်းတွေ ဆုံတွေ့စကားပြောရာက စိတ်ကူးအသစ်တွေ ရနိုင်တာကိုလည်း တန်ဖိုးထားလို့ ဖြစ်ပါတယ်။'}
];
let n1category='All',n1pos=0,n1selected=null;
function n1HTML(){if(level!=='N1')return '<h2>🎓 N1 Exam Library</h2><p>N1 Level ကို အပေါ်က ရွေးပါ။</p>';
const cats=['All','Vocabulary','Grammar','Reading'];const arr=N1BANK.filter(q=>n1category==='All'||q.type===n1category);if(n1pos>=arr.length)n1pos=0;const q=arr[n1pos];let scores={};try{scores=JSON.parse(localStorage.getItem('jlpt-n1-v05')||'{}')}catch(e){};
return `<h2>🎓 N1 Exam Library • V0.5</h2><p class="muted">ကိုယ်ပိုင်ဖန်တီးထားသော လေ့ကျင့်ခန်းနမူနာများသာဖြစ်သည်။ ၂၀၁၆–၂၀၂၅ တကယ့်စာမေးပွဲဟောင်းများ မဟုတ်ပါ။</p><p><a href="https://www.jlpt.jp/e/samples/sampleindex.html" target="_blank" rel="noopener">📖 တရားဝင် N1 Practice Workbook (JLPT Website) ↗</a></p><div class="answers">${cats.map(c=>`<button data-n1cat="${c}" class="${c===n1category?'primary':''}">${c}</button>`).join('')}</div><p class="pill">${q.type} • ${n1pos+1}/${arr.length} • ဖြေဆိုပြီး ${Object.keys(scores).length}/${N1BANK.length}</p>${q.pass?`<div class="item jp">${esc(q.pass)}</div>`:''}<p class="jp"><b>${esc(q.q)}</b></p><div class="answers">${q.opts.map((o,i)=>`<button data-n1ans="${i}" ${n1selected!==null?'disabled':''} class="${n1selected!==null?(i===q.a?'correct':i===n1selected?'wrong':''):''}">${i+1}. ${esc(o)}</button>`).join('')}</div>${n1selected!==null?`<div class="item"><b>${n1selected===q.a?'✅ အဖြေမှန်ပါတယ်':'❌ အဖြေမှားပါတယ်'}</b><p>အဖြေမှန်: ${esc(q.opts[q.a])}</p><p>${esc(q.ex)}</p></div>`:''}<p><button class="primary" data-n1next="1">နောက်မေးခွန်း →</button></p><p class="muted">Progress ကို ဒီ Browser ထဲမှာသာ သိမ်းထားပါတယ်။</p>`}

function mark(kind){const key=level+':'+kind;saved.studied[key]=true;persist();render()}function render(){renderNav();if(tab==='n1'){$('content').innerHTML=n1HTML();return;}const d=LESSONS[level];let html='';if(tab==='v')html='<h2>Vocabulary • '+level+'</h2>'+d.v.map(([w,r,m])=>`<div class="item"><div class="jp">${esc(w)}</div><div>${esc(r)}</div><div class="muted">${esc(m)}</div></div>`).join('')+'<p><button class="primary" data-done="v">Vocabulary လေ့လာပြီးပြီ ✓</button></p>';if(tab==='g')html='<h2>Grammar • '+level+'</h2>'+d.g.map(([p,meaning,ex,mm])=>`<div class="item"><div class="jp">${esc(p)}</div><div>${esc(meaning)}</div><p>${esc(ex)}</p><div class="muted">${esc(mm)}</div></div>`).join('')+'<p><button class="primary" data-done="g">Grammar လေ့လာပြီးပြီ ✓</button></p>';if(tab==='k')html='<h2>Kanji • '+level+'</h2>'+d.k.map(([kan,read,mm])=>`<div class="item"><div class="jp">${esc(kan)}</div><div>${esc(read)}</div><div class="muted">${esc(mm)}</div></div>`).join('')+'<p><button class="primary" data-done="k">Kanji လေ့လာပြီးပြီ ✓</button></p>';if(tab==='quiz')html=quizHTML();if(tab==='progress'){const n=['v','g','k'].filter(k=>saved.studied[level+':'+k]).length;const score=saved.scores[level];html=`<h2>Progress • ${level}</h2><p>လေ့လာပြီးသော အပိုင်း ${n}/3</p><div class="bar"><div style="width:${n/3*100}%"></div></div><p>နောက်ဆုံး Quiz ရလဒ်: <b>${score?score.right+'/'+score.total+' ('+Math.round(score.right/score.total*100)+'%)':'မဖြေရသေးပါ'}</b></p><p class="muted">ဒီဖုန်း၏ Browser Storage ထဲတွင်သာ သိမ်းဆည်းထားသည်။ Browser data ဖျက်ပါက ပျောက်နိုင်သည်။</p><button data-reset="1">ဒီ Level ရဲ့ Progress ဖျက်မယ်</button>`} $('content').innerHTML=html}
function makeQuestions(){const d=LESSONS[level];return d.v.slice(0,3).map(([word,reading,meaning],i)=>{let pool=[meaning,...d.v.filter(v=>v[0]!==word).map(v=>v[2])];const others=Object.values(LESSONS).flatMap(x=>x.v.map(v=>v[2])).filter(v=>!pool.includes(v));while(pool.length<4&&others.length)pool.push(others.shift());pool=pool.slice(0,4);const shift=i%4;pool=pool.slice(shift).concat(pool.slice(0,shift));return{question:`「${word}」（${reading}） ရဲ့ မြန်မာအဓိပ္ပါယ်က ဘာလဲ?`,options:pool,answer:meaning}})}
function quizHTML(){if(!test)return `<h2>${level} Mini Mock Test</h2><p>Vocabulary အခြေခံ နမူနာမေးခွန်း ၃ ခုဖြေဆိုပါ။ ဒါဟာ တရားဝင် JLPT Mock Exam အပြည့်အစုံ မဟုတ်ပါ။</p><button class="primary" data-start="1">Quiz စမယ်</button>`;if(test.index>=test.questions.length){return `<h2>Quiz Result</h2><p class="jp">${test.right} / ${test.questions.length}</p><p>သင်၏ နောက်ဆုံးအမှတ်ကို သိမ်းဆည်းပြီးပါပြီ။</p><button class="primary" data-start="1">ထပ်ဖြေမယ်</button>`}const q=test.questions[test.index];return `<h2>Mini Mock Test • ${level}</h2><div class="pill">မေးခွန်း ${test.index+1} / ${test.questions.length}</div><p><b>${esc(q.question)}</b></p><div class="answers">${q.options.map((a,i)=>`<button data-answer="${i}" ${test.answered?'disabled':''} class="${test.answered?(a===q.answer?'correct':test.selected===i?'wrong':''):''}">${esc(a)}</button>`).join('')}</div>${test.answered?`<p>${test.selectedCorrect?'✅ မှန်ပါတယ်':'❌ မှားပါတယ်'} — ${esc(q.answer)}</p><button class="primary" data-next="1">${test.index===test.questions.length-1?'ရလဒ်ကြည့်မယ်':'နောက်မေးခွန်း'}</button>`:''}`}
$('levels').addEventListener('click',e=>{const b=e.target.closest('[data-level]');if(b){level=b.dataset.level;saved.level=level;test=null;persist();render()}});$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;test=null;n1selected=null;render()}});$('content').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.n1cat){n1category=b.dataset.n1cat;n1pos=0;n1selected=null;render();return}if(b.dataset.n1ans!==undefined&&n1selected===null){n1selected=Number(b.dataset.n1ans);const arr=N1BANK.filter(q=>n1category==='All'||q.type===n1category);const q=arr[n1pos];try{const scores=JSON.parse(localStorage.getItem('jlpt-n1-v05')||'{}');scores[N1BANK.indexOf(q)]=n1selected===q.a;localStorage.setItem('jlpt-n1-v05',JSON.stringify(scores))}catch(e){}render();return}if(b.dataset.n1next){const arr=N1BANK.filter(q=>n1category==='All'||q.type===n1category);n1pos=(n1pos+1)%arr.length;n1selected=null;render();return}if(b.dataset.done){mark(b.dataset.done)}else if(b.dataset.start){test={questions:makeQuestions(),index:0,right:0,answered:false};render()}else if(b.dataset.answer!==undefined&&test&&!test.answered){const i=Number(b.dataset.answer);test.selected=i;test.selectedCorrect=test.questions[test.index].options[i]===test.questions[test.index].answer;if(test.selectedCorrect)test.right++;test.answered=true;render()}else if(b.dataset.next&&test){test.index++;test.answered=false;if(test.index>=test.questions.length){saved.scores[level]={right:test.right,total:test.questions.length};persist()}render()}else if(b.dataset.reset){if(confirm(level+' Progress ကို ဖျက်မှာ သေချာပါသလား?')){['v','g','k'].forEach(k=>delete saved.studied[level+':'+k]);delete saved.scores[level];persist();render()}}});
let dark=false;try{dark=localStorage.getItem('jlpt-dark')==='1'}catch(e){}function theme(){document.body.classList.toggle('dark',dark);$('theme').textContent=dark?'☀️ Light':'🌙 Dark'}$('theme').onclick=()=>{dark=!dark;try{localStorage.setItem('jlpt-dark',dark?'1':'0')}catch(e){}theme()};theme();render();
</script></body></html>
